<title>미제스코리아 문서 그래프</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #22262e; --ink-2: #6b7280;
  --line: #e3e6ea; --hl: #3b6fd4; --dim: rgba(34,38,46,.06);
  --c-article: #5b8def; --c-author: #e8a33d; --c-tag: #43a878;
  --c-series: #b678d9; --c-board: #e06666; --c-category: #46b5b0;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161c; --panel: #1c1f27; --ink: #e6e8ee; --ink-2: #9aa1ad;
          --line: #2a2e38; --hl: #7fa7f2; --dim: rgba(230,232,238,.07); }
}
:root[data-theme="dark"] { --bg: #14161c; --panel: #1c1f27; --ink: #e6e8ee; --ink-2: #9aa1ad;
                           --line: #2a2e38; --hl: #7fa7f2; --dim: rgba(230,232,238,.07); }
:root[data-theme="light"] { --bg: #f6f7f9; --panel: #ffffff; --ink: #22262e; --ink-2: #6b7280;
                            --line: #e3e6ea; --hl: #3b6fd4; --dim: rgba(34,38,46,.06); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 "Apple SD Gothic Neo", Pretendard, "Noto Sans KR", system-ui, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 15px; font-weight: 700; margin: 0; }
header .stats { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
header input {
  margin-left: auto; width: 230px; padding: 5px 10px; font: inherit; font-size: 13px;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
}
header input:focus { outline: 2px solid var(--hl); outline-offset: -1px; }
#main { flex: 1; display: flex; min-height: 0; }
#side {
  width: 208px; flex: none; padding: 12px 14px; overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--panel);
}
#side h2 { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
           color: var(--ink-2); margin: 14px 0 6px; }
#side h2:first-child { margin-top: 0; }
#side label { display: flex; align-items: center; gap: 7px; padding: 2.5px 0; cursor: pointer;
              font-size: 13px; font-variant-numeric: tabular-nums; }
#side label .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#side label .cnt { margin-left: auto; color: var(--ink-2); font-size: 11.5px; }
#side .hint { color: var(--ink-2); font-size: 11.5px; margin-top: 14px; line-height: 1.6; }
#wrap { flex: 1; position: relative; min-width: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
canvas.drag { cursor: grabbing; }
#tip {
  position: absolute; pointer-events: none; display: none; max-width: 320px;
  padding: 5px 9px; font-size: 12.5px; border-radius: 6px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
}
#detail {
  position: absolute; top: 10px; right: 10px; width: 280px; max-height: calc(100% - 20px);
  display: none; flex-direction: column; border-radius: 8px; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 18px rgba(0,0,0,.15);
}
#detail .head { padding: 10px 12px; border-bottom: 1px solid var(--line); }
#detail .head .t { font-weight: 700; font-size: 13.5px; }
#detail .head .m { color: var(--ink-2); font-size: 11.5px; margin-top: 2px; }
#detail .head button { float: right; border: 0; background: none; color: var(--ink-2);
                       font-size: 15px; cursor: pointer; padding: 0 0 0 8px; }
#detail .body { overflow-y: auto; padding: 6px 0; }
#detail h3 { font-size: 11px; color: var(--ink-2); margin: 8px 12px 3px; font-weight: 700; }
#detail .nb { display: block; width: 100%; text-align: left; border: 0; background: none;
              color: var(--ink); font: inherit; font-size: 12.5px; padding: 3px 12px;
              cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#detail .nb:hover, #detail .nb:focus-visible { background: var(--dim); outline: none; }
@media (max-width: 640px) { #side { display: none; } }
</style>
<header>
  <h1>미제스코리아 문서 그래프</h1>
  <span class="stats" id="stats"></span>
  <input id="q" type="search" placeholder="노드 검색… (Enter로 선택)" autocomplete="off">
</header>
<div id="main">
  <nav id="side">
    <h2>노드</h2><div id="ntypes"></div>
    <h2>엣지</h2><div id="etypes"></div>
    <div class="hint">드래그: 이동<br>휠: 확대/축소<br>클릭: 노드 선택 → 이웃 강조<br>더블클릭: 전체 보기</div>
  </nav>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <aside id="detail"></aside>
  </div>
</div>
<script>
/*
	두 가지 배포 형태를 한 템플릿으로: 빌드 시 데이터를 인라인으로 굽거나
	(아티팩트용), null로 두면 같은 경로의 graph-data.json을 fetch해 그리고
	이후 변경(Last-Modified/ETag)을 폴링해 자동으로 다시 그린다(관리자 페이지용).
*/
const INLINE = /*__DATA__*/null;
const DATA_URL = 'graph-data.json';
const POLL_MS = 60_000;
const NCOLOR = { article: '--c-article', author: '--c-author', tag: '--c-tag',
                 series: '--c-series', board: '--c-board', category: '--c-category' };
const NLABEL = { article: '글', author: '저자', tag: '태그', series: '시리즈', board: '게시판', category: '카테고리' };
const ELABEL = { links_to: '내부 링크', knn: '텍스트 kNN', tagged: '태그', authored_by: '저자',
                 in_series: '시리즈', in_board: '게시판', in_category: '카테고리' };
const EDEFAULT = { links_to: true, in_series: true, authored_by: true, tagged: true,
                   knn: false, in_board: false, in_category: false };

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let nodes = [], dedges = [], adj = [];

function applyData(DATA) {
  nodes = DATA.nodes;
  // dedupe undirected edge pairs for drawing
  const seen = new Set(); dedges = [];
  for (const e of DATA.edges) {
    const k = e.s < e.t ? e.s + '_' + e.t + e.type : e.t + '_' + e.s + e.type;
    if (!seen.has(k)) { seen.add(k); dedges.push(e); }
  }
  adj = nodes.map(() => []);
  for (const e of dedges) { adj[e.s].push({ o: e.t, type: e.type }); adj[e.t].push({ o: e.s, type: e.type }); }
  sel = -1; hov = -1; matches = null;
  buildPanels();
  draw();
}

const nShow = Object.fromEntries(Object.keys(NCOLOR).map(t => [t, true]));
const eShow = { ...EDEFAULT };
let sel = -1, hov = -1, matches = null;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const tip = document.getElementById('tip'), detail = document.getElementById('detail');
let W = 0, H = 0, scale = 1, tx = 0, ty = 0, dpr = 1, userView = false;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  if (userView) draw(); else fit();
}
function fit() {
  scale = Math.min(W, H) * 0.46; tx = W / 2; ty = H / 2; draw();
}
const sx = n => n.x * scale + tx, sy = n => n.y * scale + ty;
const rad = n => Math.max(2, Math.min(11, 1.5 + Math.sqrt(n.deg) * 0.55)) * (n.type === 'article' ? 1 : 1.25);

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const focus = sel >= 0 ? new Set([sel, ...adj[sel].map(a => a.o)]) : null;
  const ink2 = css('--ink-2');
  // edges
  for (const e of dedges) {
    if (!eShow[e.type]) continue;
    const a = nodes[e.s], b = nodes[e.t];
    if (!nShow[a.type] || !nShow[b.type]) continue;
    const inFocus = focus && (e.s === sel || e.t === sel);
    if (focus && !inFocus) continue;
    ctx.strokeStyle = ink2;
    ctx.globalAlpha = inFocus ? 0.75 : (e.type === 'knn' ? 0.05 : 0.10);
    ctx.lineWidth = inFocus ? 1.2 : 0.6;
    ctx.beginPath(); ctx.moveTo(sx(a), sy(a)); ctx.lineTo(sx(b), sy(b)); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // nodes
  const labelIdx = [];
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (!nShow[n.type]) continue;
    const dimmed = (focus && !focus.has(i)) || (matches && !matches.has(i));
    const r = rad(n);
    ctx.globalAlpha = dimmed ? 0.13 : 0.92;
    ctx.fillStyle = css(NCOLOR[n.type]);
    ctx.beginPath(); ctx.arc(sx(n), sy(n), r, 0, 7); ctx.fill();
    if (i === sel || i === hov) {
      ctx.globalAlpha = 1; ctx.strokeStyle = css('--hl'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx(n), sy(n), r + 2, 0, 7); ctx.stroke();
    }
    if (!dimmed && (i === sel || i === hov || (focus && focus.has(i)) ||
        (matches && matches.has(i) && matches.size <= 30) ||
        (!focus && !matches && n.type !== 'article' && n.deg >= 15) ||
        r * 1 > 8 && scale > 900)) labelIdx.push(i);
  }
  // labels
  ctx.globalAlpha = 1; ctx.font = '11.5px "Apple SD Gothic Neo", Pretendard, sans-serif';
  ctx.fillStyle = css('--ink');
  for (const i of labelIdx.slice(0, 80)) {
    const n = nodes[i];
    const t = n.label.length > 24 ? n.label.slice(0, 24) + '…' : n.label;
    ctx.fillText(t, sx(n) + rad(n) + 4, sy(n) + 4);
  }
}

function nearest(mx, my) {
  let best = -1, bd = 144;
  for (let i = 0; i < nodes.length; i++) {
    if (!nShow[nodes[i].type]) continue;
    const dx = sx(nodes[i]) - mx, dy = sy(nodes[i]) - my, d = dx * dx + dy * dy;
    const r = rad(nodes[i]) + 6;
    if (d < Math.max(bd, 0) && d < (r * r + 60)) { bd = d; best = i; }
  }
  return best;
}

function select(i) {
  sel = i;
  if (i < 0) { detail.style.display = 'none'; draw(); return; }
  const n = nodes[i];
  const groups = {};
  for (const a of adj[i]) (groups[a.type] = groups[a.type] || []).push(a.o);
  let html = `<div class="head"><button aria-label="닫기" onclick="select(-1)">×</button>` +
    `<div class="t">${esc(n.label)}</div><div class="m">${NLABEL[n.type]} · 연결 ${n.deg}</div></div><div class="body">`;
  for (const [t, os] of Object.entries(groups)) {
    html += `<h3>${ELABEL[t]} (${os.length})</h3>`;
    for (const o of os.slice(0, 40))
      html += `<button class="nb" onclick="focusNode(${o})">${esc(nodes[o].label)}</button>`;
  }
  detail.innerHTML = html + '</div>';
  detail.style.display = 'flex';
  draw();
}
function focusNode(i) {
  const n = nodes[i];
  tx = W / 2 - n.x * scale; ty = H / 2 - n.y * scale;
  select(i);
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// panels
function buildPanels() {
  const counts = {};
  for (const n of nodes) counts[n.type] = (counts[n.type] || 0) + 1;
  document.getElementById('ntypes').innerHTML = Object.keys(NCOLOR).map(t =>
    `<label><input type="checkbox" ${nShow[t] ? 'checked' : ''} data-nt="${t}" hidden>` +
    `<span class="sw" style="background:var(${NCOLOR[t]})"></span>${NLABEL[t]}<span class="cnt">${counts[t] || 0}</span></label>`).join('');
  const ecounts = {};
  for (const e of dedges) ecounts[e.type] = (ecounts[e.type] || 0) + 1;
  document.getElementById('etypes').innerHTML = Object.keys(ELABEL).map(t =>
    `<label><input type="checkbox" ${eShow[t] ? 'checked' : ''} data-et="${t}">` +
    `${ELABEL[t]}<span class="cnt">${ecounts[t] || 0}</span></label>`).join('');
  document.getElementById('stats').textContent =
    `노드 ${nodes.length.toLocaleString()} · 엣지 ${dedges.length.toLocaleString()}` +
    (dataStamp ? ` · ${dataStamp}` : '');
}
document.getElementById('side').addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.nt) {
    nShow[el.dataset.nt] = el.checked;
    const sw = el.closest('label').querySelector('.sw');
    if (sw) sw.style.opacity = el.checked ? 1 : 0.25;
  }
  if (el.dataset.et) eShow[el.dataset.et] = el.checked;
  draw();
});

// interactions
let dragging = false, moved = false, lx = 0, ly = 0;
cv.addEventListener('pointerdown', e => { dragging = true; moved = false; lx = e.offsetX; ly = e.offsetY; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (dragging) {
    const dx = e.offsetX - lx, dy = e.offsetY - ly;
    if (Math.abs(dx) + Math.abs(dy) > 2) { moved = true; userView = true; }
    tx += dx; ty += dy; lx = e.offsetX; ly = e.offsetY; draw();
  } else {
    const i = nearest(e.offsetX, e.offsetY);
    if (i !== hov) { hov = i; draw(); }
    if (i >= 0) {
      tip.style.display = 'block';
      tip.style.left = Math.min(e.offsetX + 14, W - 330) + 'px';
      tip.style.top = (e.offsetY + 14) + 'px';
      tip.textContent = `[${NLABEL[nodes[i].type]}] ${nodes[i].label}`;
    } else tip.style.display = 'none';
  }
});
cv.addEventListener('pointerup', e => {
  dragging = false; cv.classList.remove('drag');
  if (!moved) { const i = nearest(e.offsetX, e.offsetY); select(i); }
});
cv.addEventListener('pointerleave', () => { hov = -1; tip.style.display = 'none'; draw(); });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  userView = true;
  const f = Math.exp(-e.deltaY * 0.0015);
  tx = e.offsetX - (e.offsetX - tx) * f; ty = e.offsetY - (e.offsetY - ty) * f;
  scale *= f; draw();
}, { passive: false });
cv.addEventListener('dblclick', () => { select(-1); userView = false; fit(); });

const q = document.getElementById('q');
q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  if (!v) { matches = null; draw(); return; }
  matches = new Set();
  for (let i = 0; i < nodes.length; i++)
    if (nodes[i].label.toLowerCase().includes(v)) matches.add(i);
  draw();
});
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && matches && matches.size) focusNode([...matches][0]);
  if (e.key === 'Escape') { q.value = ''; matches = null; draw(); }
});

new ResizeObserver(resize).observe(cv.parentElement);
window.addEventListener('resize', resize);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/*
	부트스트랩. 인라인 데이터가 있으면 그대로(아티팩트), 없으면 fetch로
	그리고 이후 변경을 폴링한다 — 인덱스 갱신이 배포되면 열어둔 화면이
	1분 안에 스스로 최신 그래프로 다시 그려진다.
*/
let dataStamp = null;
let lastTag = null;

async function loadRemote() {
  const res = await fetch(DATA_URL, { cache: 'no-cache' });
  if (!res.ok) return;
  lastTag = res.headers.get('last-modified') || res.headers.get('etag');
  if (lastTag) {
    const d = new Date(res.headers.get('last-modified') || Date.now());
    dataStamp = isNaN(d) ? null : `데이터 ${d.toLocaleString('ko-KR')}`;
  }
  applyData(await res.json());
  if (!userView) fit();
}

if (INLINE) {
  applyData(INLINE);
} else {
  loadRemote();
  setInterval(async () => {
    try {
      const head = await fetch(DATA_URL, { method: 'HEAD', cache: 'no-cache' });
      const tag = head.headers.get('last-modified') || head.headers.get('etag');
      if (tag && tag !== lastTag) await loadRemote();
    } catch { /* 다음 주기에 재시도 */ }
  }, POLL_MS);
}
resize();
</script>
