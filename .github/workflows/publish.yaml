# npm 자동 퍼블리시 — Trusted Publishing(OIDC)이라 토큰·OTP가 필요 없다.
#
# 쓰는 법 두 가지:
#  · GitHub 웹에서: Actions → "Publish to npm" → Run workflow → bump 선택(patch 등)
#    → CI가 버전 커밋 + 태그 + 퍼블리시까지 전부 수행 (로컬 작업 불필요)
#  · 로컬에서: npm version patch && git push --follow-tags
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: '버전 올림 (none이면 현재 package.json 버전 그대로 퍼블리시)'
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write   # bump 커밋·태그 푸시용
  id-token: write   # OIDC 발급용

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest   # OIDC(trusted publishing) 지원 버전 보장
      - run: npm ci
      - run: npm run check

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          npm version "${{ inputs.bump }}" -m "v%s"
          git push --follow-tags

      - run: npm publish --access public --provenance
