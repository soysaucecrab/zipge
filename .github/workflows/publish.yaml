# npm 자동 퍼블리시 — Trusted Publishing(OIDC)이라 토큰·OTP가 필요 없다.
# 사용법: npm version patch && git push --follow-tags
# 사전 조건(1회): npmjs.com → zipge 패키지 → Settings → Trusted Publisher
#   → GitHub: soysaucecrab/zipge, workflow: publish.yaml 등록
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC 발급용

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest   # OIDC(trusted publishing) 지원 버전 보장
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public --provenance
